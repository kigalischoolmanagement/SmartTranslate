name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/build-log.txt") 2>&1
          set -x
          mkdir -p _src
          Z=$(ls *.zip | head -1)
          unzip -oq "$Z" -d _src
          DIR=$(dirname "$(find _src -name settings.gradle.kts | head -1)")
          echo "Project dir: $DIR"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd "$DIR"
          /tmp/gradle-8.7/bin/gradle assembleDebug --stacktrace --no-daemon

      - name: Show log on summary page
        if: always()
        run: |
          echo '### Build log (last 60 lines)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f build-log.txt ]; then tail -60 build-log.txt >> $GITHUB_STEP_SUMMARY; else echo "No log file" >> $GITHUB_STEP_SUMMARY; fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: SmartTranslate-APK
          path: _src/**/app-debug.apk
