name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p _src
          Z=$(ls *.zip | head -1)
          python3 -m zipfile -e "$Z" _src
          echo "DIR=$(dirname "$(find _src -name settings.gradle.kts | head -1)")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          cd "$DIR"
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee $GITHUB_WORKSPACE/build-log.txt

      - name: Show errors on summary page
        if: always()
        run: |
          echo '### Build log (last lines)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |What went wrong|error:|FAILURE|Could not|not found" -A4 build-log.txt | head -40 >> $GITHUB_STEP_SUMMARY || true
          tail -15 build-log.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: SmartTranslate-APK
          path: _src/**/app-debug.apk
