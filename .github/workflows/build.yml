name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          mkdir -p _src
          Z=$(ls *.zip | head -1)
          unzip -oq "$Z" -d _src
          DIR=$(dirname "$(find _src -name settings.gradle.kts | head -1)")
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd "$DIR"
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon --console=plain > "$GITHUB_WORKSPACE/build-log.txt" 2>&1 || touch "$GITHUB_WORKSPACE/FAILED"
          tail -5 "$GITHUB_WORKSPACE/build-log.txt"

      - name: Show errors on summary page
        if: always()
        run: |
          echo '### Compile errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |What went wrong|error:" -A2 build-log.txt | cut -c1-230 | head -30 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail if build failed
        run: test ! -f FAILED

      - uses: actions/upload-artifact@v4
        with:
          name: SmartTranslate-APK
          path: _src/**/app-debug.apk
